[project]
name = "green-river"
version = "0.1.0"
description = "E-commerce product scraper and LLM context preparation"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "scrapling[rag]>=0.4.12",
    "uvicorn>=0.52.4",
]

[project.scripts]
green-river = "green_river.cli:main"
green-river-api = "green_river.app.api:run"


[build-system]
requires = ["hatchling>=1.25"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green_river"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
